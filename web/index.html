<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teklif Onaylama</title>

<style>
  body {
    background: #f5f6f7;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
  }

  .container {
    max-width: 420px;
    margin: 60px auto;
    background: white;
    padding: 32px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    text-align: center;
  }

  .title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 12px;
    color: #111827;
  }

  .info {
    font-size: 15px;
    color: #555;
    margin-bottom: 8px;
  }

  .buttons {
    margin-top: 24px;
  }

  button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    font-weight: 600;
  }

  .approve {
    background: #10b981;
    color: white;
  }

  .reject {
    background: #ef4444;
    color: white;
  }

  .status-box {
    margin-top: 24px;
    font-size: 17px;
    font-weight: bold;
    padding: 16px;
    border-radius: 10px;
  }

  .success {
    background: #d1fae5;
    color: #065f46;
  }

  .failed {
    background: #fee2e2;
    color: #991b1b;
  }
</style>

</head>
<body>

<div class="container" id="card">
  <div class="title">Teklif Bilgisi Yükleniyor...</div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const quoteId = urlParams.get("id");

  const card = document.getElementById("card");

  async function loadQuote() {
    const res = await fetch(`https://selcukcan74.github.io/redbook/#/verify?get_quote?id=${quoteId}`);
    const data = await res.json();

    card.innerHTML = `
      <div class="title">Teklif #${data.quote_number}</div>
      <div class="info">Tutar: ₺${data.total}</div>
      <div class="info">Müşteri: ${data.customer}</div>
      <div class="info">Durum: ${data.status}</div>

      <div class="buttons">
        <button class="approve" onclick="approve()">Teklifi Onayla</button>
        <button class="reject" onclick="reject()">Reddet</button>
      </div>
    `;
  }

  async function approve() {
    const res = await fetch(`https://selcukcan74.github.io/redbook/#/verify?get_quote?id=${quoteId}`);
    card.innerHTML = `<div class="status-box success">✔ Teklif Başarıyla Onaylandı</div>`;
  }

  async function reject() {
    const res = await fetch(`https://selcukcan74.github.io/redbook/#/verify?get_quote?id=${quoteId}`);
    card.innerHTML = `<div class="status-box failed">✖ Teklif Reddedildi</div>`;
  }

  loadQuote();
</script>

</body>
</html>
