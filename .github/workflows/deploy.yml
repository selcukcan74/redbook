name: Deploy Flutter Web to redbook-verify

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo (redbook)
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/redbook-verify/"

      - name: Deploy to redbook-verify repo
        uses: peaceiris/actions-gh-pages@v3
        with:
          external_repository: selcukcan74/redbook-verify
          publish_branch: gh-pages
          publish_dir: build/web
          github_token: ${{ secrets.VERIFY_REPO_TOKEN }}
          force_orphan: true
